name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: false  # no cache in a workflow that publishes binaries (zizmor cache-poisoning)

      - name: Run tests
        run: go test ./...

  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            asset: igc-sync-linux-amd64
          - goos: darwin
            goarch: amd64
            asset: igc-sync-darwin-amd64
          - goos: darwin
            goarch: arm64
            asset: igc-sync-darwin-arm64
          - goos: windows
            goarch: amd64
            asset: igc-sync-windows-amd64.exe

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: false  # no cache in a workflow that publishes binaries (zizmor cache-poisoning)

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          TAG: ${{ github.ref_name }}
        run: |
          go build -trimpath -ldflags="-s -w -X main.version=${TAG}" \
            -o ${{ matrix.asset }} .

      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          ASSET: ${{ matrix.asset }}
        run: gh release upload "$TAG" "$ASSET" --clobber
