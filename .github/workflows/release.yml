name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          # Latest stable Go, not go.mod's minimum: stdlib security fixes ship as Go releases.
          go-version: stable
          check-latest: true
          cache: false  # no cache in a workflow that publishes binaries (zizmor cache-poisoning)

      - name: Run tests
        run: go test ./...

  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            asset: igc-sync-linux-amd64
          - goos: darwin
            goarch: amd64
            asset: igc-sync-darwin-amd64
          - goos: darwin
            goarch: arm64
            asset: igc-sync-darwin-arm64
          - goos: windows
            goarch: amd64
            asset: igc-sync-windows-amd64.exe

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          # Latest stable Go, not go.mod's minimum: stdlib security fixes ship as Go releases.
          go-version: stable
          check-latest: true
          cache: false  # no cache in a workflow that publishes binaries (zizmor cache-poisoning)

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          TAG: ${{ github.ref_name }}
        run: |
          go build -trimpath -ldflags="-s -w -X main.version=${TAG}" \
            -o ${{ matrix.asset }} .

      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          ASSET: ${{ matrix.asset }}
        run: gh release upload "$TAG" "$ASSET" --clobber
